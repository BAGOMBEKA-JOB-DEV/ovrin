# Continuous integration for ovrin.
#
# Every non-obvious choice below has a comment explaining the failure it
# prevents. A CI file nobody understands is a CI file people disable.
#
# Every step below calls a Makefile target rather than restating a command.
# The Makefile is the single definition: `make ci` locally runs what this file
# runs, because this file runs `make`. Two copies of one command set is how a
# gate and its documentation drift apart.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "*/v*"]
  pull_request:
    branches: [main]

# Least privilege at the top; individual jobs escalate only if they must.
permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  # Modules must build in isolation, exactly as a user gets them. A go.work
  # file would silently resolve inter-module dependencies from the working
  # tree, so a module could pass CI while being unbuildable once published.
  GOWORK: "off"

jobs:
  # Runs today. Everything else is waiting for code.
  #
  # The checks live in scripts/check-docs.py rather than in heredocs here: five
  # inline shell blocks in a workflow is the shape nobody can run locally and
  # nobody maintains.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"

      # Link and anchor resolution, rules.md §N and ADR-NNNN citations, ADR
      # hygiene, ovrin.X references against api/ovrin.txt, layout-tree
      # agreement, and fence markers.
      - name: check documentation
        run: make docs

  # Every module in the repository, found rather than listed.
  #
  # A hand-written matrix goes stale the moment somebody adds an adapter, and
  # the failure is silent: the module is simply never built. Discovery makes
  # "we forgot to add it to CI" impossible.
  #
  # Each module is built at its OWN declared floor and at the newest release.
  # Testing only the newest lets a floor become a lie — code using a Go 1.26
  # feature compiles on 1.26 while go.mod claims 1.22, and the first user on
  # 1.22 discovers it.
  discover:
    name: discover modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - id: find
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re

          newest = "1.27"
          entries = []
          for base, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in {".git", "testdata"}]
              if "go.mod" not in files:
                  continue
              path = os.path.relpath(base, ".")
              text = open(os.path.join(base, "go.mod")).read()
              m = re.search(r"^go (\d+\.\d+)", text, re.M)
              floor = m.group(1) if m else newest
              entries.append({"module": path, "go": floor})
              if floor != newest:
                  entries.append({"module": path, "go": newest})
          entries.sort(key=lambda e: (e["module"], e["go"]))
          print("matrix=" + json.dumps({"include": entries}))
          PY

  build:
    name: build ${{ matrix.module }} @ go${{ matrix.go }}
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version: ${{ matrix.go }}
          # go.mod is listed first because it is the only one of the two
          # guaranteed to exist. Most modules here have no go.sum at all --
          # zero dependencies is the rule for the core (docs/rules.md 4.1) and
          # the habit everywhere else -- and setup-go fails the step when its
          # dependency path resolves to nothing. go.sum is still listed so that
          # a module which has one gets the more precise cache key.
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum

      # MODULES overrides the Makefile's discovery so each matrix leg does
      # exactly its own module, while the command itself stays defined once.
      - name: gofmt
        run: make fmt-check MODULES=${{ matrix.module }}

      - name: build
        run: make build MODULES=${{ matrix.module }}

      # Tagged files are real code. Vetting only the untagged build lets them
      # rot until someone runs the tagged suite months later.
      - name: vet
        run: make vet MODULES=${{ matrix.module }}

      # -count=1 defeats the test cache; a cached pass proves nothing about
      # this commit. The sandbox tag exercises the full stack over real
      # sockets without credentials or cost.
      - name: test
        run: make test-cover MODULES=${{ matrix.module }}

      # docs/rules.md §3.7 — never lower this to make a red build green.
      - name: coverage floor
        if: matrix.module == '.' && matrix.go == '1.27'
        run: make cover-floor

  tidy:
    name: tidy
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with: { go-version: "${{ matrix.go }}" }
      - run: make tidy-check MODULES=${{ matrix.module }}

  deps:
    name: core has zero dependencies
    runs-on: ubuntu-latest
    if: hashFiles('go.mod') != ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with: { go-version: "${{ env.GO_VERSION }}" }

      # docs/rules.md §4.1. This is the property most likely to be lost by
      # accident and hardest to reverse once users depend on it, so it is a
      # job rather than a review comment.
      - name: no external requires
        run: make deps-check

      # docs/rules.md §4.3. Static builds and cross-compilation are why a lot
      # of people choose Go, and a transitive cgo dependency breaks both.
      - name: builds without cgo, cross-compiled
        run: make cross

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb0f9e6e3b # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with: { go-version: "${{ env.GO_VERSION }}" }
      # The version is pinned in the Makefile, so it is pinned once.
      - run: make tools-vuln
      - run: make vuln MODULES=${{ matrix.module }}

  # The single check branch protection requires. Naming each job in the
  # repository settings means that list silently goes stale every time a
  # module or a Go version is added — and a stale required-checks list is a
  # branch protection rule that protects nothing.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    if: always()
    needs: [docs, discover, build, tidy, deps, lint, vuln]
    steps:
      - run: |
          for r in '${{ needs.docs.result }}' '${{ needs.discover.result }}' \
                   '${{ needs.build.result }}' \
                   '${{ needs.tidy.result }}' '${{ needs.deps.result }}' \
                   '${{ needs.lint.result }}' '${{ needs.vuln.result }}'; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass ($r)"; exit 1 ;;
            esac
          done
